# The crates that build on all three OSes, checked on Linux, macOS and Windows alike: format, strict clippy and the
# tests of each crate in PACKAGES. Each task that makes a crate cross-platform adds it to PACKAGES and its generator
# checks as steps of the `crates` job. No Miri job: it ran the Rust VT port's memory core (page buffers, its
# allocators), which left this branch with the port (branch `rust-vt-port`). The rest of the workspace (GPUI, WPE,
# libghostty-vt) builds on Linux only and stays in rust-linux.yml. agterm-server (AF_UNIX and `flock`) and agterm-ctl
# (an AF_UNIX client, tested against the server) are `any` crates that stay out until the control server has its
# Windows form, which belongs to the GPUI-on-Windows plan.
# Pushes to a `ci/**` branch run it too, so a macOS or Windows form can be checked on the runners without a PR.
name: cross-platform

on:
  pull_request:
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `-p` per crate; word-split by bash, which every step runs in (Git Bash on Windows)
  PACKAGES: -p agterm-session -p agterm-proto -p agterm-host -p agterm-core

defaults:
  run:
    shell: bash

jobs:
  crates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt $PACKAGES --check
      - name: clippy
        run: cargo clippy --locked $PACKAGES --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked $PACKAGES --all-features
