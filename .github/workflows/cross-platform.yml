# The crates that build on all three OSes, checked on Linux, macOS and Windows alike: format, strict clippy and the
# tests of each crate in PACKAGES, then the VT memory core's tests under Miri. Each Zig-free-core task that makes a
# crate cross-platform adds it to PACKAGES (agterm-session, agterm-proto, agterm-host, agterm-core) and its generator
# checks as steps of the `crates` job. The rest of the workspace (GPUI, WPE, libghostty-vt) builds on Linux only and
# stays in rust-linux.yml.
# Pushes to a `ci/**` branch run it too, so a macOS or Windows form can be checked on the runners without a PR.
name: cross-platform

on:
  pull_request:
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `-p` per crate; word-split by bash, which every step runs in (Git Bash on Windows)
  PACKAGES: -p agterm-vt -p agterm-session

defaults:
  run:
    shell: bash

jobs:
  crates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt $PACKAGES --check
      - name: clippy
        run: cargo clippy --locked $PACKAGES --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked $PACKAGES --all-features
      # agterm-vt's Unicode tables are what its generator writes from the pinned uucode's UCD (fetched and checked by
      # sha256), on every OS
      - name: Unicode tables (gen-vt-unicode.sh --check)
        run: scripts/gen-vt-unicode.sh --check

  # agterm-vt's memory core under Miri (mem: offsets, the bitmap allocator, the ref-counted set, the page hash map,
  # fallible allocation and the test allocators; datastruct: the insertion-ordered map, Wyhash; os::page_allocator),
  # on a nightly pinned by date: bump MIRI_NIGHTLY on its own, to a day whose manifest carries miri
  # (static.rust-lang.org/dist/<date>/channel-rust-nightly.toml). The filters select the core's unit tests by module
  # path. libtest matches substrings, so `os::` alone would also take any `pos::` test: the page allocator is named in
  # full, and a later module whose path contains `mem::` or `datastruct::` must not be named so.
  miri:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MIRI_NIGHTLY: nightly-2026-10-18
    steps:
      - uses: actions/checkout@v7
      - name: nightly with miri (${{ env.MIRI_NIGHTLY }})
        run: |
          rustup toolchain install "$MIRI_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$MIRI_NIGHTLY" miri setup
      - name: memory core under Miri
        run: |
          cargo "+$MIRI_NIGHTLY" miri test --locked -p agterm-vt --lib -- mem:: datastruct:: os::page_allocator::
