# Temporary Task 19 probe; removed once reference-macos is green.
name: macos-probe

on:
  pull_request:
    paths:
      - .github/workflows/macos-probe.yml
      - .github/probe/**

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the suite
        run: python -m pip install -e conformance
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agterm-conformance/reference
          key: agterm-reference-v0.36.0
      - name: fetch the reference
        id: reference
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python conformance/tools/fetch_reference.py --tag v0.36.0 | tee -a "$GITHUB_OUTPUT"
      - name: zsh login shell
        run: |
          dscl . -read "/Users/$USER" UserShell
          sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          dscl . -read "/Users/$USER" UserShell
          python -c 'import os, pwd; print(pwd.getpwuid(os.getuid()).pw_shell)'
      - name: pane overlay exit statuses
        continue-on-error: true
        env:
          BUNDLE: ${{ steps.reference.outputs.bundle }}
        run: python .github/probe/probe_overlay.py "$BUNDLE"
      - name: failing launches, with screenshots
        continue-on-error: true
        shell: bash
        env:
          BUNDLE: ${{ steps.reference.outputs.bundle }}
          PYTHONPATH: .github/probe
        run: |
          python -m pytest -p probe_plugin conformance/tests/protocol/test_restore.py conformance/tests/protocol/test_tree.py conformance/tests/protocol/test_workspace.py \
            --impl swift-macos --bin "$BUNDLE" -ra 2>&1 | tee pytest.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            pytest.log
            probe-out/
          if-no-files-found: warn
