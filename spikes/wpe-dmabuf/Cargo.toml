[package]
name = "wpe-dmabuf-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (docs/spikes/20261014-wpe-dmabuf.md), outside the agterm-rs workspace.
[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9" }
image = { version = "0.25", default-features = false }
async-channel = "2"
futures = "0.3"
env_logger = "0.11"
log = "0.4"
serde_json = "1"

[build-dependencies]
cc = "1"

# Local patched copies (scripts/vendor.sh applies patches/*.patch to the crates.io sources).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

[profile.release]
debug = "line-tables-only"
