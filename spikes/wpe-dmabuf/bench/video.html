<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>video bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<script>
  // Plays the 1080p60 VP9 clip (YouTube format 303) and reports playback quality and rAF rate. With ?report=1 the
  // page POSTs a sample per second to the bench server (for engines the spike cannot evaluate JS in).
  const v = document.getElementById('v');
  const params = new URLSearchParams(location.search);
  // ?codec=avc plays the H.264 stream (YouTube format 299, fragmented for MSE) instead of VP9 (format 303).
  const avc = params.get('codec') === 'avc';
  const media = avc ? '/media/yt-1080p60-avc-frag.mp4' : '/media/yt-1080p60-vp9.webm';
  const mime = avc ? 'video/mp4; codecs="avc1.64002A"' : 'video/webm; codecs="vp9"';
  // MSE by default, as YouTube plays; ?progressive=1 sets src instead. WebKit (GTK and WPE alike) stalls a
  // progressive download here: its on-disk buffering never completes ("Pausing stream for buffering").
  if (params.get('progressive') === '1') {
    v.src = media;
  } else {
    const ms = new MediaSource();
    v.src = URL.createObjectURL(ms);
    ms.addEventListener('sourceopen', async () => {
      // Appended in 1 MB pieces, staying ~20 s ahead of playback (WebKit refuses a whole 20 MB append with
      // QuotaExceededError), the way a streaming player feeds MSE.
      try {
        const sb = ms.addSourceBuffer(mime);
        const data = new Uint8Array(await (await fetch(media)).arrayBuffer());
        let offset = 0;
        const ahead = () => sb.buffered.length ? sb.buffered.end(sb.buffered.length - 1) - v.currentTime : 0;
        const pump = () => {
          if (sb.updating) return;
          if (offset >= data.length) { if (ms.readyState === 'open') ms.endOfStream(); return; }
          if (ahead() > 20) { setTimeout(pump, 250); return; }
          if (sb.buffered.length && v.currentTime - sb.buffered.start(0) > 10) sb.remove(0, v.currentTime - 5);
          else { sb.appendBuffer(data.subarray(offset, offset + (1 << 20))); offset += 1 << 20; }
        };
        sb.addEventListener('updateend', pump);
        sb.addEventListener('error', () => { window.__note = 'sb-error'; });
        pump();
      } catch (e) { window.__note = 'mse: ' + e; }
    });
  }
  let rafCount = 0, rafLast = performance.now(), rafFps = 0, rafLong = 0;
  function tick(now) {
    if (now - rafLast > 25) rafLong++;
    rafCount++;
    rafLast = now;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  let lastCount = 0, lastTime = performance.now();
  window.__bench = () => {
    const q = v.getVideoPlaybackQuality();
    const now = performance.now();
    rafFps = (rafCount - lastCount) * 1000 / (now - lastTime);
    lastCount = rafCount; lastTime = now;
    return {engine: navigator.userAgent, t: v.currentTime, w: v.videoWidth, h: v.videoHeight, paused: v.paused,
            total: q.totalVideoFrames, dropped: q.droppedVideoFrames, raf_fps: rafFps, raf_long: rafLong,
            note: window.__note || '', error: v.error ? v.error.code + ' ' + v.error.message : ''};
  };
  v.play().catch(e => console.log('play failed', e));
  if (params.get('report') === '1') {
    setInterval(() => {
      fetch('/report', {method: 'POST', body: JSON.stringify({page: 'video', ...window.__bench()})});
    }, 1000);
  }
</script>
</body>
</html>
