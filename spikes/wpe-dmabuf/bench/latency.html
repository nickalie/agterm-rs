<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>latency bench</title>
<style>html, body { margin: 0; height: 100%; } body { background: #303030; }</style>
</head>
<body>
<script>
  // Static page: every keydown or click flips the background, so the first frame after an input is its response.
  let flip = false;
  const toggle = () => { flip = !flip; document.body.style.background = flip ? '#c03030' : '#303030'; };
  window.addEventListener('keydown', toggle);
  window.addEventListener('mousedown', toggle);
</script>
</body>
</html>
