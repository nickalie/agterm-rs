[package]
name = "gpui-term-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (docs/spikes/20261014-gpui-term.md), outside the agterm-rs workspace.
[workspace]

[features]
# gpui-kit's own defaults (component + assets), the set the plan names; still without gpui-fast. The spike itself
# builds without them (`cargo check --features kit-defaults` checks the full set).
kit-defaults = ["gpui-kit/default"]

[dependencies]
gpui-kit = { version = "=0.7.3", default-features = false }
libghostty-vt = "=0.2.2"
portable-pty = "0.9"
png = "0.18"
anyhow = "1"
async-channel = "2"
serde_json = "1"
# the versions gpui-pre itself uses, for RenderImage frames
image = { version = "0.25", default-features = false }
smallvec = "1"
