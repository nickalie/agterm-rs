# gir input of agterm-wpe-sys; the output is regenerated by scripts/gen-wpe-bindings.sh, which passes the .gir
# directories. WPEWebKit: the web view, network session, user content and script messages, policies, URI schemes,
# settings and downloads.
[options]
work_mode = "sys"
library = "WPEWebKit"
version = "2.0"
# the WPE API the GPUI frontend targets (WPE_API_VERSION of build/pins.env): nothing older is probed or bound
min_cfg_version = "2.54"
single_version_file = "."
# build.rs is generated once and then kept: it adds the tests' rpath to a vendored WPE (scripts/fetch-wpe.sh)
split_build_rs = true
external_libraries = ["GLib", "GObject", "Gio"]

# the library's own version macros: the ABI tests would pin them to the exact micro release
ignore = [
    "WPEWebKit.MAJOR_VERSION",
    "WPEWebKit.MINOR_VERSION",
    "WPEWebKit.MICRO_VERSION",
]

# `use <crate>_sys as <namespace>;`: soup3-sys comes in as `soup-sys`, the two sibling crates as `wpe-*-sys`
[external_libraries]
Soup = { crate = "soup" }
WPEJavaScriptCore = { crate = "wpe_javascriptcore" }
WPEPlatform = { crate = "wpe_platform" }
