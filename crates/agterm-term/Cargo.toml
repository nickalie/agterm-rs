[package]
name = "agterm-term"
description = "agterm's terminal pane core: libghostty-vt behind a lock, a PTY (agterm-pty) and an IO thread per pane, frames and events in its own types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
agterm-core.workspace = true
agterm-ghostty-vt.workspace = true
# a pane's PTY and child (openpty, Windows' pseudoconsole) and the actor that moves its bytes
agterm-pty.workspace = true
# the live-launch inputs a live pane's host starts from
agterm-session.workspace = true
# the OSC 5522 classifier decodes metadata and MIME lists as Ghostty does (strict, padded)
base64.workspace = true
bitflags.workspace = true
png.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# the PTY's foreground process group and input modes, the hostname, a non-blocking open of an input file
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# the hostname OSC 7 reports are matched against (`GetComputerNameW`, as Ghostty reads it)
windows-sys = { workspace = true, features = ["Win32_System_WindowsProgramming"] }

[dev-dependencies]
# the `SessionHost` the live tests list and kill their sessions through
agterm-host.workspace = true
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# whether a killed child is gone (`OpenProcess`, `GetExitCodeProcess`)
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
