[package]
name = "agterm-session"
description = "agterm's live-session server, on herdr's architecture: its wire and its endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Taken from herdr (Apache-2.0) as code; NOTICE carries herdr's license.
license = "MIT AND Apache-2.0"

[dependencies]
interprocess.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# The effective user, whom the namespace directory must belong to.
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# The pipe's SDDL, in the UTF-16 string type interprocess takes.
widestring.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
