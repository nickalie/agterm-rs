[package]
name = "agterm-gtk"
description = "agterm's GTK4/libadwaita frontend: the agterm binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agterm"
path = "src/main.rs"

[dependencies]
adw.workspace = true
agterm-core.workspace = true
agterm-host.workspace = true
agterm-proto.workspace = true
agterm-server.workspace = true
agterm-ghostty.workspace = true
# Not used in code: a links crate's metadata (DEP_GHOSTTY_ROOT, for the rpaths in build.rs) reaches only the build
# scripts of its direct dependents.
agterm-ghostty-sys.workspace = true
async-channel.workspace = true
glib-unix.workspace = true
gtk.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
webkit6 = { workspace = true, optional = true }

[features]
default = ["html"]
# HTML overlays on WebKitGTK, which becomes a runtime dependency; without it the app installs no page host and the
# core refuses every page.
html = ["dep:webkit6"]

[lints]
workspace = true

[dev-dependencies]
agterm-host = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
