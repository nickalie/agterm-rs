version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agterm"
path = "src/main.rs"

[dependencies]
adw.workspace = true
agterm-core.workspace = true
agterm-host.workspace = true
agterm-proto.workspace = true
agterm-server.workspace = true
agterm-ghostty.workspace = true
# Not used in code: a links crate's metadata (DEP_GHOSTTY_ROOT, for the rpaths in build.rs) reaches only the build
# scripts of its direct dependents.
agterm-ghostty-sys.workspace = true
async-channel.workspace = true
glib-unix.workspace = true
gtk.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
