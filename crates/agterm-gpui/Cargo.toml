[package]
name = "agterm-gpui"
description = "agterm's GPUI frontend: the agterm binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agterm"
path = "src/main.rs"

[features]
default = ["html"]
# HTML overlays on WPE WebKit (agterm-wpe, Linux), which needs a WPE WebKit at build and run time (README > WPE
# WebKit). Without it the core refuses every page; the Ubuntu CI jobs build that way.
html = ["dep:agterm-wpe", "dep:gio"]

[dependencies]
agterm-app.workspace = true
agterm-core.workspace = true
agterm-host.workspace = true
agterm-proto.workspace = true
agterm-server.workspace = true
agterm-term.workspace = true
agterm-zmx.workspace = true
ashpd.workspace = true
async-channel.workspace = true
cosmic-text.workspace = true
fancy-regex.workspace = true
futures-util.workspace = true
gpui-kit.workspace = true
image.workspace = true
libc.workspace = true
notify.workspace = true
# text watermarks are written as PNG files the terminals' `background-image` reads
png.workspace = true
raw-window-handle.workspace = true
# the windows' saved frames (`window_frames.rs`)
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
# write_*_file: the screen file goes into a temporary directory of its own, as Ghostty's does
tempfile.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
# RandR: the X11 monitors a restored window is kept on (`monitors.rs` `display_rects`), which GPUI's one display per X
# screen spans
x11rb = { workspace = true, features = ["randr"] }
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
agterm-wpe = { workspace = true, optional = true }
# the default web browser a page hands off to, whatever the address's type (upstream's `SystemBrowser`): the gio the
# WPE host already links
gio = { workspace = true, optional = true }
gpui-pre-linux.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys.workspace = true

[dev-dependencies]
agterm-host = { workspace = true, features = ["fakes"] }
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-pre-wgpu.workspace = true
# the global hotkey's test presses its keys on a private Xvfb through XTEST (tests/global_hotkey.rs); the window test
# lays monitors out on one through RandR (tests/x11_window.rs)
x11rb = { workspace = true, features = ["randr", "xtest"] }

# GPUI's headless renderer opens one GPU device per process, so the external texture cases run in a child process per
# Vulkan driver, which this harness starts (tests/external_texture/main.rs).
[[test]]
name = "external_texture"
path = "tests/external_texture/main.rs"
harness = false

# HTML pages end to end on the real WPE WebKit, which runs once per process: a child per Vulkan driver, each a plain
# process whose engine runs in a worker where WPE WebKit is vendored (tests/html_overlay/main.rs).
[[test]]
name = "html_overlay"
path = "tests/html_overlay/main.rs"
harness = false
required-features = ["html"]

# The app, its Live panes and their sessions keep the user's privileges while pages run (tests/privileges.rs).
[[test]]
name = "privileges"
path = "tests/privileges.rs"
required-features = ["html"]

[lints]
workspace = true
