[package]
name = "agterm-gpui"
description = "agterm's GPUI frontend: the agterm-gpui binary until it replaces the GTK one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agterm-gpui"
path = "src/main.rs"

[dependencies]
agterm-app.workspace = true
agterm-core.workspace = true
agterm-host.workspace = true
agterm-proto.workspace = true
agterm-server.workspace = true
agterm-term.workspace = true
async-channel.workspace = true
gpui-kit.workspace = true
libc.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
x11rb.workspace = true
zbus.workspace = true

[dev-dependencies]
agterm-host = { workspace = true, features = ["fakes"] }
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-pre-wgpu.workspace = true
tempfile.workspace = true

# GPUI's headless renderer opens one GPU device per process, so the external texture cases run in a child process per
# Vulkan driver, which this harness starts (tests/external_texture/main.rs).
[[test]]
name = "external_texture"
path = "tests/external_texture/main.rs"
harness = false

[lints]
workspace = true
