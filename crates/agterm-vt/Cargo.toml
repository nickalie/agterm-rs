[package]
name = "agterm-vt"
description = "Ghostty's terminal in Rust: the VT core of agterm's panes and live sessions, taken from rustty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The table generators the generator scripts run (`gen-unicode`: scripts/gen-vt-unicode.sh); the library has no part
# of them.
gen = []

[[bin]]
name = "gen-unicode"
path = "src/bin/gen-unicode/main.rs"
required-features = ["gen"]

[[test]]
name = "gen_unicode"
required-features = ["gen"]

[dependencies]
bytemuck.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
