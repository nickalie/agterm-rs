[package]
name = "agterm-ghostty-vt-sys"
description = "Raw bindings to the prebuilt static libghostty-vt (Ghostty's official vt C API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "ghostty-vt"
build = "build.rs"

# Not under the workspace lints: the bindings are bindgen output (scripts/gen-ghostty-vt-bindings.sh), named after
# the C header.
[lints.rust]
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"

[dev-dependencies]
tempfile.workspace = true
