[package]
name = "agterm-ghostty-sys"
description = "Raw bindings to the prebuilt, patched libghostty embedding API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "ghostty"
build = "build.rs"

# Not under the workspace lints: the bindings are bindgen output (scripts/gen-ghostty-bindings.sh), named after
# the C header.
[lints.rust]
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"
