# ngterm built-in terminal defaults, loaded before the user's own configs, which still override them (upstream
# agterm/Resources/ghostty-defaults.conf, with the Linux Edit chords).
window-padding-x = 8
window-padding-y = 6

# a steady block cursor: no-cursor keeps shell integration from flipping it to a bar at the prompt. no-title keeps
# it from titling every prompt with the abbreviated cwd, which would override the sidebar's name; explicit OSC
# titles (ssh, PROMPT_COMMAND) still arrive.
cursor-style = block
shell-integration-features = no-cursor,no-title

# a double-click selecting a word in the prompt must not move the shell cursor there.
cursor-click-to-move = false

# copy, paste and select all on any keyboard layout: ghostty's own Linux binds are unicode triggers, matched against
# the character the layout produces, so on a Cyrillic or Greek layout they never fire. These physical-key triggers
# match the key's position. Not `performable:`: Copy without a selection must not fall through to key encoding,
# where the kitty keyboard protocol would report the chord to the program.
keybind = ctrl+shift+key_c=copy_to_clipboard
keybind = ctrl+shift+key_v=paste_from_clipboard
keybind = ctrl+shift+key_a=select_all
