# gir input of agterm-wpe-javascriptcore-sys; the output is regenerated by scripts/gen-wpe-bindings.sh, which passes
# the .gir directories. The WPE WebKit build of JavaScriptCore (namespace WPEJavaScriptCore), not GTK's.
[options]
work_mode = "sys"
library = "WPEJavaScriptCore"
version = "2.0"
# the WPE API the GPUI frontend targets (WPE_API_VERSION of build/pins.env): nothing older is probed or bound
min_cfg_version = "2.54"
single_version_file = "."
# build.rs is generated once and then kept: it says where WPE WebKit comes from when the probe fails
split_build_rs = true
external_libraries = ["GLib", "GObject"]

# the library's own version macros: the ABI tests would pin them to the exact micro release
ignore = [
    "WPEJavaScriptCore.MAJOR_VERSION",
    "WPEJavaScriptCore.MINOR_VERSION",
    "WPEJavaScriptCore.MICRO_VERSION",
]
