# gir input of agterm-wpe-platform-sys; the output is regenerated by scripts/gen-wpe-bindings.sh, which passes the
# .gir directories. WPEPlatform: displays, views, buffers (dmabuf, SHM), input events and the keymap, with the class
# structs a WPEDisplay/WPEView subclass fills.
[options]
work_mode = "sys"
library = "WPEPlatform"
version = "2.0"
# the WPE API the GPUI frontend targets (WPE_API_VERSION of build/pins.env): nothing older is probed or bound
min_cfg_version = "2.54"
single_version_file = "."
external_libraries = ["GLib", "GObject", "Gio"]

# the library's own version macros: the ABI tests would pin them to the exact micro release
ignore = [
    "WPEPlatform.PLATFORM_MAJOR_VERSION",
    "WPEPlatform.PLATFORM_MINOR_VERSION",
    "WPEPlatform.PLATFORM_MICRO_VERSION",
]
