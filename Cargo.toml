[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
agterm-proto = { path = "crates/agterm-proto" }
agterm-ghostty-sys = { path = "crates/agterm-ghostty-sys" }
agterm-ghostty = { path = "crates/agterm-ghostty" }
agterm-ghostty-vt-sys = { path = "crates/agterm-ghostty-vt-sys" }
agterm-ghostty-vt = { path = "crates/agterm-ghostty-vt" }
agterm-host = { path = "crates/agterm-host" }
agterm-core = { path = "crates/agterm-core" }
agterm-server = { path = "crates/agterm-server" }
agterm-zmx = { path = "crates/agterm-zmx" }
agterm-app = { path = "crates/agterm-app" }
agterm-wpe-javascriptcore-sys = { path = "crates/agterm-wpe-javascriptcore-sys" }
agterm-wpe-platform-sys = { path = "crates/agterm-wpe-platform-sys" }
agterm-wpe-sys = { path = "crates/agterm-wpe-sys" }
async-channel = "2"
# glib's Unix-only API (SIGTERM on the main loop), a crate of its own; it follows the glib that gtk4 0.11 uses.
glib-unix = "0.22"
base64 = "0.23"
bitflags = "2"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
# `default-features = false` drops the `html` renderer and the CLI's `getopts`: the HUD walks the events itself.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a result built as a `Value` keeps its fields in upstream's order on the wire (the catalog's
# `fields` order) instead of sorting them.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
strum = { version = "0.27", features = ["derive"] }
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
# Parsing only: the agent hooks installer reads Codex's `config.toml` before appending to it.
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Unicode full case folding: ghostty's keybind character triggers compare folded.
unicase = "2.10"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
# GTK 4.14 and libadwaita 1.5 are Ubuntu 24.04's, the oldest platform CI builds on.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
# The quick terminal's layer-shell panel. No version feature: the 1.0 API is enough. It links the C library, built by
# scripts/build-layer-shell.sh or taken from a system package (scripts/pkg-config.sh picks).
gtk4-layer-shell = "0.8"
# agterm-gtk's build script asks the same pkg-config the link used where gtk4-layer-shell lives, for its rpath.
pkg-config = "0.3"
# WebKitGTK 6.0 for HTML overlays; no version feature: the 2.40 API is enough, and Ubuntu 24.04 ships 2.44.
webkit6 = "0.6"
# The GLib and libsoup -sys crates the gir-generated WPE WebKit bindings (agterm-wpe*-sys) build on: the gtk-rs 0.22
# family gtk4 0.11 uses, and the soup3-sys webkit6 uses, under the name gir gives it.
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"
soup-sys = { package = "soup3-sys", version = "0.9" }

# Inherited by every crate (`[lints] workspace = true`) except the generated -sys crates: `agterm-ghostty-sys` and
# `agterm-ghostty-vt-sys` (bindgen), `agterm-wpe-sys`, `agterm-wpe-platform-sys` and `agterm-wpe-javascriptcore-sys`
# (gir). Only a reasoned outer `#[expect(..., reason = "...")]` on the one item can lift a lint: `#[allow]` is refused.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
